<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="#4A0008" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:site_name" content="{{brand}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="{{ogImage}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/webp" href="/assets/logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="is-loading">
    <div class="loader" id="loader" role="progressbar" aria-label="Ładowanie strony" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="logo-plate logo-plate--lg"><img src="/assets/logo.webp" alt="{{brand}}" width="2000" height="667" /></span>
      <div class="loader__bar"><span id="loader-fill"></span></div>
      <p class="loader__value" id="loader-value">0%</p>
    </div>

    <header class="site-header is-hidden" id="header"></header>

    <main>
      <section class="story" id="story" aria-label="Historia kubka">
        <canvas class="story__backdrop" id="backdrop" width="64" height="36" aria-hidden="true"></canvas>
        <canvas class="story__frames" id="frames" aria-hidden="true"></canvas>
        <canvas class="story__particles" id="particles" aria-hidden="true"></canvas>
        <div class="story__stages" id="stages"></div>
      </section>
      <div id="sections"></div>
    </main>

    <footer class="site-footer" id="footer"></footer>

    <noscript>
      <p class="noscript">{{description}}</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
