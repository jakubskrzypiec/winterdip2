# Wysyła stronę na hosting OVH (winterdip.pl) po każdej zmianie w gałęzi main.
# Połączenie szyfrowane SFTP. Hasło jest w ustawieniach repo:
# Settings → Secrets and variables → Actions → FTP_PASSWORD.
name: Wdrożenie na OVH

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalacja lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Wysyłka przez SFTP (tylko zmienione pliki)
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3; set net:timeout 30;
            open -u wintera,\"$FTP_PASSWORD\" sftp://ftp.cluster129.hosting.ovh.net:22;
            mirror --reverse --ignore-time --parallel=4 --verbose=1 \
              --exclude-glob .git* --exclude-glob .github/ --exclude-glob tools/ \
              --exclude-glob README.md --exclude-glob URUCHOMIENIE.md \
              ./ www/;
            bye"
