# Wysyła stronę na hosting OVH (winterdip.pl) po każdej zmianie w gałęzi main.
# Połączenie szyfrowane SFTP. Hasło jest w ustawieniach repo:
# Settings → Secrets and variables → Actions → FTP_PASSWORD.
#
# Push: wysyłane są dokładnie pliki zmienione w tym pushu (wg git), usunięte są kasowane.
# Ręczne uruchomienie (Actions → Run workflow): wysyłka całej strony.
name: Wdrożenie na OVH

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalacja lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Lista plików do wysłania
        id: files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          skip='^(\.github/|\.git|tools/|README\.md$|URUCHOMIENIE\.md$)'
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=ACMR "$BEFORE" "$AFTER" | grep -Ev "$skip" > upload.txt || true
            git diff --name-only --diff-filter=D "$BEFORE" "$AFTER" | grep -Ev "$skip" > delete.txt || true
            echo "mode=diff" >> "$GITHUB_OUTPUT"
          else
            git ls-files | grep -Ev "$skip" > upload.txt
            : > delete.txt
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi
          echo "Do wysłania: $(wc -l < upload.txt), do usunięcia: $(wc -l < delete.txt)"
          cat upload.txt delete.txt | head -50

      - name: Wysyłka przez SFTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          {
            echo "set sftp:auto-confirm yes"
            echo "set net:max-retries 3"
            echo "set net:timeout 30"
            echo "set cmd:fail-exit no"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              d=$(dirname "$f")
              [ "$d" = "." ] && d="" || d="/$d"
              echo "mkdir -p -f \"www$d\""
              echo "put -O \"www$d\" \"$f\""
            done < upload.txt
            while IFS= read -r f; do
              [ -n "$f" ] && echo "rm -f \"www/$f\""
            done < delete.txt
            echo "bye"
          } > commands.lftp
          n=$(wc -l < upload.txt)
          if [ "$n" -eq 0 ] && [ ! -s delete.txt ]; then echo "Brak zmian strony do wysłania."; exit 0; fi
          lftp -u "wintera,$FTP_PASSWORD" -e "source commands.lftp" sftp://ftp.cluster129.hosting.ovh.net:22
          echo "Wysłano $n plików."
